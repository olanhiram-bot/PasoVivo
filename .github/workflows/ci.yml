name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://pasovivo:pasovivo_local@127.0.0.1:5432/pasovivo?schema=public
  API_SERVICE_SECRET: secreto-ci-de-servicio-con-longitud-suficiente
  NEXTAUTH_SECRET: secreto-ci-de-authjs-con-longitud-suficiente

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pasovivo
          POSTGRES_USER: pasovivo
          POSTGRES_PASSWORD: pasovivo_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasovivo -d pasovivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detección de secretos evidentes
        run: |
          if grep -rInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude-dir=dist .; then
            echo 'Posible secreto en el repositorio. Revísalo antes de continuar.'
            exit 1
          fi

      - name: Preparar base de datos
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          pnpm db:deploy
          pnpm db:seed

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E de la demo (Chromium)
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pasovivo
          POSTGRES_USER: pasovivo
          POSTGRES_PASSWORD: pasovivo_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasovivo -d pasovivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preparar base de datos
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          pnpm db:deploy
          pnpm db:seed

      - run: pnpm build

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
